<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Contact Us</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 480px; margin: 60px auto; }
  input, textarea { width: 100%; padding: 8px; margin: 6px 0 14px; box-sizing: border-box; }
  button { padding: 10px 18px; cursor: pointer; }
  #status { margin-top: 14px; font-weight: bold; }
</style>
</head>
<body>
  <h2>Contact Us</h2>
  <form id="contactForm">
    <label>Name</label>
    <input type="text" id="name" required maxlength="100" />

    <label>Email</label>
    <input type="email" id="email" required />

    <label>Message</label>
    <textarea id="message" rows="5" required minlength="2" maxlength="5000"></textarea>

    <button type="submit">Send</button>
  </form>
  <div id="status"></div>

  <script>
    const API_URL = 'http://localhost:3000/contact/form';

    document.getElementById('contactForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const statusEl = document.getElementById('status');
      statusEl.textContent = 'Sending...';
      statusEl.style.color = 'black';

      const payload = {
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        message: document.getElementById('message').value,
      };

      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        const data = await res.json();

        if (res.ok) {
          statusEl.style.color = 'green';
          statusEl.textContent = `Success! Submission ID: ${data.submission.id}`;
          e.target.reset();
        } else {
          statusEl.style.color = 'red';
          statusEl.textContent = data.message || 'Something went wrong.';
        }
      } catch (err) {
        statusEl.style.color = 'red';
        statusEl.textContent = 'Network error — is the backend running?';
      }
    });
  </script>
</body>
</html>
